
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK AI | PRO SIGNALS</title>
    <style>
        :root {
            --bg-dark: #05060a;
            --bg-panel: #0f1118;
            --text-main: #eef2f7;
            --text-dim: #8b9bb4;
            --accent-green: #00ff9d;
            --accent-red: #ff3b3b;
            --border: #2a2f45;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-mono); }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 10;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Terminal */
        .terminal-header { 
            margin-bottom: 10px; 
            font-size: 0.75rem; 
            color: var(--text-dim); 
            text-transform: uppercase; 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
            display: flex;
            justify-content: space-between;
        }

        .log-container {
            flex: 1;
            overflow-y: auto;
            font-size: 0.75rem;
            padding-right: 5px;
        }

        .log-entry {
            margin-bottom: 6px;
            padding-left: 8px;
            border-left: 2px solid var(--border);
            animation: slideIn 0.3s ease-out;
            line-height: 1.4;
        }

        .log-entry.buy { border-left-color: var(--accent-green); color: var(--text-main); }
        .log-entry.sell { border-left-color: var(--accent-red); color: var(--text-main); }
        .log-entry.info { border-left-color: var(--text-dim); color: var(--text-dim); font-style: italic; }

        .time-stamp { opacity: 0.6; margin-right: 5px; }

        /* Main Header */
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 6, 10, 0.98);
        }

        .logo { 
            font-size: 1.2rem; 
            font-weight: bold; 
            color: var(--accent-green); 
            letter-spacing: -1px; 
        }

        /* Dashboard Grid */
        .controls { 
            padding: 15px 20px; 
            display: flex; 
            gap: 10px; 
            background: #0a0b10; 
            border-bottom: 1px solid var(--border);
        }

        .search-box {
            flex: 1;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
        }
        .search-box:focus { outline: none; border-color: var(--accent-green); box-shadow: 0 0 5px rgba(0,255,157,0.3); }

        .btn {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 6px 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover { background: var(--accent-green); color: black; }

        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 15px;
        }

        /* Card Styles */
        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card:hover { transform: translateY(-3px); z-index: 10; background: #141826; }

        /* Signal States */
        .card.buy-sig { border-color: var(--accent-green); box-shadow: 0 0 12px rgba(0, 255, 157, 0.15); }
        .card.sell-sig { border-color: var(--accent-red); box-shadow: 0 0 12px rgba(255, 59, 59, 0.15); }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .asset-name { font-size: 1.1rem; font-weight: bold; color: white; }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; background: #1a1e2b; color: var(--text-dim); }

        .price-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
        .price { font-size: 1.6rem; font-weight: bold; }
        .pct { font-size: 0.9rem; font-weight: 500; }

        .metrics { 
            display: flex; justify-content: space-between; 
            font-size: 0.7rem; color: var(--text-dim); 
            background: #080a10; padding: 6px; border-radius: 4px; margin-bottom: 10px; 
        }

        .sig-bar { display: flex; gap: 5px; height: 36px; }
        .pill { 
            flex: 1; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase;
        }
        .pill-label { font-size: 0.55rem; opacity: 0.7; margin-bottom: 2px; font-weight: normal; }

        /* Pill Colors */
        .pill-buy { background: rgba(0, 255, 157, 0.1); color: var(--accent-green); border-bottom: 2px solid var(--accent-green); }
        .pill-sell { background: rgba(255, 59, 59, 0.1); color: var(--accent-red); border-bottom: 2px solid var(--accent-red); }
        .pill-wait { background: #1a1e2b; color: var(--text-dim); border-bottom: 2px solid transparent; }

        /* Scrollbar & Loader */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #2a2f45; border-radius: 3px; }

        .loader-wrap {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,6,10,0.9); z-index: 100;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #2a2f45; border-top-color: var(--accent-green);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        .loader-text { color: var(--text-dim); font-size: 0.8rem; letter-spacing: 2px; animation: pulse 2s infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

    </style>
</head>
<body>

    <!-- Sidebar / Terminal -->
    <aside class="sidebar">
        <div class="terminal-header">
            <span>System Log</span>
            <span style="font-size: 0.6rem; opacity: 0.5;">/var/log/signals</span>
        </div>
        <div id="log-container" class="log-container">
            <!-- Logs injected here -->
        </div>
    </aside>

    <!-- Main Dashboard -->
    <section class="main-content">
        <header class="header">
            <div class="logo">&lt;/&gt; DARK_AI<span style="color:white;">BOT</span></div>
            <div style="font-size: 0.8rem; color: var(--text-dim);">
                Status: <span id="status-text" style="color: var(--accent-green); font-weight: bold;">ACTIVE</span>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Search (e.g. BTC, ETH)..." oninput="renderCards()">
            <button class="btn" onclick="fetchAll()">REFRESH</button>
        </div>

        <div id="grid" class="grid-container">
            <!-- Cards injected here -->
        </div>

        <!-- Loader Overlay -->
        <div id="loader" class="loader-wrap">
            <div class="spinner"></div>
            <div class="loader-text">INITIALIZING DARK ENGINE</div>
        </div>
    </section>

<script>
/**
 * DARK AI BOT - FINAL VERSION (No Gold)
 * Fixes: 
 * 1. Binance Symbol List Fetching (Correct filtering).
 * 2. Price Data Fetching (Robust JSON parsing).
 * 3. Signal Logic (Dark Hacker Strategy).
 */

const CONFIG = {
    binanceUrl: 'https://fapi.binance.com/fapi/v1'
};

let allSymbols = []; // List of symbols to process
let marketData = {}; // Map of symbol -> data object
let logContainer = document.getElementById('log-container');
let gridContainer = document.getElementById('grid');
let loaderEl = document.getElementById('loader');

// --- 1. DATA FETCHING ---

async function fetchAll() {
    showLoader(true);
    log("Starting System Scan...", "info");

    try {
        // 1. Fetch Binance Futures Symbols (The List)
        const symUrl = `${CONFIG.binanceUrl}/exchangeInfo`;

        // Robust fetch with JSON handling
        const symResponse = await fetch(symUrl);
        if(!symResponse.ok) throw new Error(`Symbol fetch failed: ${symResponse.statusText}`);
        const symData = await symResponse.json();

        // Filter: Only Perpetual USDT Pairs (Main Trading pairs)
        allSymbols = symData.symbols.filter(s => 
            s.contractType === 'PERPETUAL' && 
            s.quoteAsset === 'USDT' &&
            s.status === 'TRADING'
        ).map(s => s.symbol);

        log(`Loaded ${allSymbols.length} Futures Pairs.`, "info");

        // 2. Fetch Binance Ticker Data (The Prices)
        const tickUrl = `${CONFIG.binanceUrl}/ticker/24hr`;
        const tickResponse = await fetch(tickUrl);

        if(!tickResponse.ok) throw new Error(`Price fetch failed: ${tickResponse.statusText}`);
        const tickData = await tickResponse.json();

        // Map data to our state object
        tickData.forEach(t => {
            if(allSymbols.includes(t.symbol)) {
                marketData[t.symbol] = {
                    symbol: t.symbol,
                    price: parseFloat(t.lastPrice),
                    open: parseFloat(t.openPrice),
                    high: parseFloat(t.highPrice),
                    low: parseFloat(t.lowPrice),
                    pctChange: parseFloat(t.priceChangePercent)
                };
            }
        });

        // Process and Render
        renderCards();
        log(`Scan Complete. ${Object.keys(marketData).length} pairs processed.`, "info");

    } catch (error) {
        console.error(error);
        log("CRITICAL ERROR: Data feed interrupted.", "info");
        document.getElementById('status-text').innerText = "ERROR";
        document.getElementById('status-text').style.color = "#ff3b3b";

        // Render whatever data we have so UI isn't empty
        renderCards();
    } finally {
        showLoader(false);
    }
}

// --- 2. SIGNAL LOGIC (DARK HACKER METHOD) ---

function calculateSignal(symData) {
    const p = symData.price;
    const o = symData.open;
    const h = symData.high;
    const l = symData.low;
    const pct = symData.pctChange;

    // 1. Determine Trend (Price vs Open)
    const trendUp = p > o;

    // 2. Calculate Range Position (RSI approximation)
    // If price is in top 40% of range, RSI is high (>60). Bottom 40%, RSI low (<40).
    const range = h - l;
    // Handle zero range case
    const pos = range === 0 ? 0.5 : (p - l) / range; 

    // 3. Momentum Filter (Min volatility to avoid fake signals)
    const volatility = Math.abs(pct);

    let action = 'HOLD';
    let confidence = 0;

    // Crypto Logic: 
    // Buy if trending up, price is in upper half of range (not overbought), and momentum > 1.5%
    if(trendUp && pct > 1.5 && pos < 0.8) {
        action = 'BUY';
        confidence = 70 + (pct * 5); // Base 70%, add momentum
    } 
    // Sell if trending down, price is in lower half of range (not oversold), and momentum > -1.5%
    else if (!trendUp && pct < -1.5 && pos > 0.2) {
        action = 'SELL';
        confidence = 70 + (Math.abs(pct) * 5);
    }

    // 4. Calculate Dynamic TP / SL based on Volatility (ATR proxy)
    const atr = range * 0.6; 

    let tp, sl;
    if(action === 'BUY') {
        tp = p + (atr * 2); // 1:2 Risk Reward Ratio
        sl = p - (atr * 1);
    } else if (action === 'SELL') {
        tp = p - (atr * 2);
        sl = p + (atr * 1);
    } else {
        // If HOLD, set TP/SL near price
        tp = p; 
        sl = p;
    }

    return { action, confidence: Math.min(98, Math.round(confidence)), tp, sl };
}

// --- 3. RENDERING UI ---

function renderCards() {
    const filter = document.getElementById('searchInput').value.toUpperCase();
    gridContainer.innerHTML = '';

    allSymbols.forEach(sym => {
        // Filter logic
        if (marketData[sym] && (!filter || sym.includes(filter))) {
            const d = marketData[sym];
            const sig = calculateSignal(d);

            // Styles based on action
            const isBuy = sig.action === 'BUY';
            const isSell = sig.action === 'SELL';
            const colorClass = isBuy ? 'up' : (isSell ? 'down' : '');

            gridContainer.innerHTML += `
                <div class="card ${isBuy ? 'buy-sig' : (isSell ? 'sell-sig' : '')}">
                    <div class="card-top">
                        <span class="asset-name">${sym}</span>
                        <span class="badge">PERP</span>
                    </div>
                    <div class="price-row">
                        <span class="price ${colorClass}">${formatPrice(d.price)}</span>
                        <span class="pct ${colorClass}">${d.pctChange > 0 ? '+' : ''}${d.pctChange.toFixed(2)}%</span>
                    </div>

                    <div class="metrics">
                        <span>TREND <b>${isBuy ? 'LONG' : (isSell ? 'SHORT' : 'SIDE')}</b></span>
                        <span>STR: <b style="color:white;">${sig.confidence}%</b></span>
                    </div>

                    <div class="sig-bar">
                        <div class="pill ${isBuy ? 'pill-buy' : (isSell ? 'pill-sell' : 'pill-wait')}">${sig.action}</div>
                        <div class="pill pill-buy" style="border-bottom-color:var(--accent-green);">TP ${formatPrice(sig.tp)}</div>
                        <div class="pill pill-sell" style="border-bottom-color:var(--accent-red);">SL ${formatPrice(sig.sl)}</div>
                    </div>
                </div>
            `;

            // Log only Strong signals to the terminal sidebar
            if((isBuy && sig.confidence > 80) || (isSell && sig.confidence > 80)) {
                log(`${sym} ${sig.action} @ ${formatPrice(d.price)} [SL:${formatPrice(sig.sl)}]`, isBuy ? 'buy' : 'sell');
            }
        }
    });
}

// --- UTILITIES ---

function formatPrice(price) {
    if(!price) return '...';
    if (price > 100) return price.toFixed(2);
    if (price > 1) return price.toFixed(4);
    return price.toFixed(6);
}

function log(msg, type='info') {
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    const time = new Date().toLocaleTimeString([], { hour12: false });
